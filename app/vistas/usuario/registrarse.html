<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="publico/css/registro.css">
    <title>ServindustriaTR</title>
</head>
<body>
    <div class="contenedor">
        <form class="formulario" action="registro" method="post">
            <h2 class="titulo">Registrarse</h2>
            <div class="contenido">
                <label>Correo electronico</label>
                <input class="input" type="email" name="correo" required>
            </div>
            <div class="contenido">
                <label>Contraseña</label>
                <input class="input" type="password" name="clave" required>
            </div>
            <button class="enviar" type="submit" name="registrar">Registrar</button>
            <p class="parrafo">Ya tienes cuenta: <a class="acceder" href="acceder">Acceder</a></p>
            <a href="/servindustriaTR" class="volver">volver al inicio</a>
        </form>
    </div>
</body>
</html>
